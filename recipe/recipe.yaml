schema_version: 1

context:
  name: open-clip-torch
  version: "4.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mlfoundations/open_clip/archive/v${{ version }}.tar.gz
  sha256: 7852a3d6e4d4d54593f56d38c66ea09570b0d25f3a43f811ab9addaa00405832

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm
    - pdm-backend
  run:
    - safetensors
    - python >=${{ python_min }}
    - pytorch >=2.6
    - torchvision
    - regex
    - ftfy
    - tqdm
    - huggingface_hub
    - timm >=1.0.30
    - tiktoken
tests:
  - python:
      imports:
        - open_clip
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: OpenCLIP
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mlfoundations/open_clip

extra:
  recipe-maintainers:
    - jan-janssen
